<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;font-family:system-ui,-apple-system,sans-serif;color:#172033;padding:18px}main{width:100%;max-width:360px;background:white;border-radius:28px;padding:24px;box-shadow:0 12px 45px #1720330c}h1{font-size:18px;font-weight:600;margin:0 0 28px}#history{min-height:24px;text-align:right;color:#8590a2;font-size:16px;overflow-wrap:anywhere}#display{display:block;width:100%;text-align:right;font-size:clamp(25px,8vw,44px);font-weight:500;min-height:70px;padding:8px 0 20px;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;border-radius:18px;min-height:62px;font:500 23px system-ui;background:#f3f5f8;color:#172033;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.95);background:#e1e6ee}button:focus-visible{outline:3px solid #899dff;outline-offset:2px}.utility{color:#677387}.operator{background:#eef0ff;color:#535ce5}.equals{background:#535ce5;color:white;grid-column:1/-1}.equals:active{background:#414acb}.zero{grid-column:span 2}footer{font-size:12px;color:#9299a7;text-align:center;margin-top:22px}
</style>
</head>
<body>
<main aria-label="Калькулятор">
<h1>Калькулятор</h1><div id="history"></div><output id="display" aria-live="polite">0</output>
<div class="keys">
<button class="utility" data-key="clear">AC</button><button class="utility" data-key="back" aria-label="Удалить цифру">⌫</button><button class="utility" data-key="percent">%</button><button class="operator" data-key="/" aria-label="Разделить">÷</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*" aria-label="Умножить">×</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-" aria-label="Вычесть">−</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+" aria-label="Сложить">+</button>
<button class="utility" data-key="sign" aria-label="Изменить знак">±</button><button class="zero" data-key="0">0</button><button data-key=".">,</button><button class="equals" data-key="=" aria-label="Равно">=</button>
</div><footer>Нажимай кнопки — всё уже работает</footer>
</main>
<script>
const display=document.getElementById('display');
const history=document.getElementById('history');
let value='0',left=null,operation=null,waiting=false,finished=false;
const symbols={'+':'+','-':'−','*':'×','/':'÷'};
function render(){display.textContent=value.replace('.',',')}
function clear(){value='0';left=null;operation=null;waiting=false;finished=false;history.textContent='';render()}
function calculate(a,b,op){
 if(op==='/'&&b===0)throw Error('На ноль делить нельзя');
 const n=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b;
 if(!Number.isFinite(n))throw Error('Слишком большое число');
 return String(Number(n.toPrecision(12)));
}
function press(key){
 try{
  if(key==='clear'){clear();return}
  if(value==='Ошибка')clear();
  if(/^\d$/.test(key)||key==='.'){
   if(waiting||finished){value='0';waiting=false;if(finished){finished=false;history.textContent=''}}
   if(key==='.'){if(!value.includes('.'))value+='.'}
   else if(value.replace(/[-.]/g,'').length<15){value=value==='0'?key:value==='-0'?'-'+key:value+key}
  }else if(key==='back'){
   if(waiting||finished)return;
   value=value.slice(0,-1);if(!value||value==='-')value='0';
  }else if(key==='sign'||key==='percent'){
   if(waiting){value='0';waiting=false}
   value=key==='sign'?String(-Number(value)):String(Number(value)/100);finished=false;
  }else if(symbols[key]){
   if(operation&&!waiting)value=calculate(left,Number(value),operation);
   left=Number(value);operation=key;waiting=true;finished=false;
   history.textContent=value.replace('.',',')+' '+symbols[key];
  }else if(key==='='&&operation){
   const right=Number(value);
   history.textContent=String(left).replace('.',',')+' '+symbols[operation]+' '+value.replace('.',',')+' =';
   value=calculate(left,right,operation);left=null;operation=null;waiting=false;finished=true;
  }
 }catch(error){value='Ошибка';history.textContent=error.message;left=null;operation=null;waiting=false;finished=true}
 render();
}
document.querySelector('.keys').addEventListener('click',event=>{const button=event.target.closest('button');if(button)press(button.dataset.key)});
document.addEventListener('keydown',event=>{
 if(event.target.tagName==='BUTTON'&&(event.key==='Enter'||event.key===' '))return;
 let key=event.key;if(key==='Enter')key='=';if(key===',')key='.';if(key==='Escape')key='clear';if(key==='Backspace')key='back';
 if(/^[0-9.+*/=-]$/.test(key)||['clear','back'].includes(key)){event.preventDefault();press(key)}
});
</script>
</body>
</html>
